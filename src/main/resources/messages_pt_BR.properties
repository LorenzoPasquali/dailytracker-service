ai.stages_note=IMPORTANTE - Etapas dinâmicas do quadro: O quadro Kanban não usa mais colunas fixas PLANNED/DOING/DONE. As etapas (colunas) atuais, em ordem, são: {0}. Ao filtrar tarefas por status ou definir o status de uma tarefa, use APENAS esses nomes exatos de etapa. A primeira etapa significa não iniciada; a última significa concluída. Ignore qualquer texto anterior que mencione colunas fixas Planejado/Em Progresso/Feito.
