server:
  port: ${PORT:3000}

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: dailytracker-service

  datasource:
    url: ${DATABASE_URL}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      keepalive-time: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
            redirect-uri: "{baseUrl}/auth/google/callback"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo

  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
    locations: classpath:db/migration

  ai:
    mcp:
      server:
        enabled: true
        type: SYNC
        name: dailytracker-mcp
        version: 0.0.1
        # SSE transport endpoints kept under /mcp so SecurityConfig can guard /mcp/**.
        # Fase 1: endpoint blocked externally (denyAll); internal Gemini bridges to the
        # tool callbacks in-process. Fase 2 swaps the guard for per-user MCP token auth.
        sse-endpoint: /mcp/sse
        sse-message-endpoint: /mcp/message
        # Periodic SSE pings keep the connection alive across idle gaps (e.g. while the
        # user composes a prompt). Without this the stream dies after minutes idle and
        # later tool responses never reach the client → "Request timed out" in Claude.
        keep-alive-interval: 20s
        request-timeout: 60s

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000 # 24 hours
    refresh-expiration: 2592000000 # 30 days
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  aes-secret: ${AES_SECRET}
  notifications:
    from-email: ${NOTIFICATIONS_FROM_EMAIL:noreply@dailytracker.app}
    from-name: ${NOTIFICATIONS_FROM_NAME:DailyTracker}
    enabled: ${NOTIFICATIONS_ENABLED:true}
    resend-api-key: ${RESEND_API_KEY}
