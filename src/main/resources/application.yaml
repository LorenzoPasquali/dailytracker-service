server:
  port: ${PORT:3000}
  # Honor X-Forwarded-* from the reverse proxy so OAuth metadata (issuer, endpoint URLs)
  # is advertised with the public https host, not the internal http:host:port.
  forward-headers-strategy: framework

spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: dailytracker-service

  datasource:
    url: ${DATABASE_URL}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 300000
      keepalive-time: 60000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: profile, email
            redirect-uri: "{baseUrl}/auth/google/callback"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo

  flyway:
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
    locations: classpath:db/migration

  ai:
    mcp:
      server:
        enabled: true
        type: SYNC
        name: dailytracker-mcp
        version: 0.0.1
        # Streamable HTTP (MCP 2025 transport) at /mcp — what native "add custom connector"
        # flows speak. mcp-remote (legacy dt_mcp fallback) also handles this URL.
        # All under /mcp so SecurityConfig/McpAuthFilter guard /mcp/**.
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
          # Periodic pings keep the stream alive across idle gaps (else it dies after
          # minutes idle and later tool responses never reach the client).
          keep-alive-interval: 20s
        request-timeout: 60s

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000 # 24 hours
    refresh-expiration: 2592000000 # 30 days
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  aes-secret: ${AES_SECRET}
  # Public base URL of this API — used as the OAuth 2.1 issuer. Must be the exact
  # https origin clients reach (metadata/issuer validation is strict).
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  oauth:
    # RSA signing key (JWK JSON) for OAuth access tokens. Must be stable across restarts,
    # else every issued token/refresh breaks. Blank = generate ephemeral (dev only, warns).
    jwk: ${MCP_OAUTH_JWK:}
  notifications:
    from-email: ${NOTIFICATIONS_FROM_EMAIL:noreply@dailytracker.app}
    from-name: ${NOTIFICATIONS_FROM_NAME:DailyTracker}
    enabled: ${NOTIFICATIONS_ENABLED:true}
    resend-api-key: ${RESEND_API_KEY}
