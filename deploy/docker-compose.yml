# Deployment compose file for the Hostinger VPS.
# Place this file (and a filled-in .env) in a directory on the server, e.g.
#   /opt/dailytracker/docker-compose.yml
#   /opt/dailytracker/.env
# The GitHub Actions deploy job runs `docker compose pull && up -d` here.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  service:
    image: ghcr.io/lorenzopasquali/dailytracker-service:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}?user=${POSTGRES_USER}&password=${POSTGRES_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      AES_SECRET: ${AES_SECRET}
      FRONTEND_URL: ${FRONTEND_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      NOTIFICATIONS_FROM_EMAIL: ${NOTIFICATIONS_FROM_EMAIL:-noreply@dailytracker.app}
      NOTIFICATIONS_FROM_NAME: ${NOTIFICATIONS_FROM_NAME:-DailyTracker}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
    ports:
      - "3000:3000"

  app:
    image: ghcr.io/lorenzopasquali/dailytracker-app:latest
    restart: unless-stopped
    depends_on:
      - service
    environment:
      # Baked into the bundle at container startup (see app's docker-entrypoint.sh)
      VITE_API_URL: ${VITE_API_URL}
    ports:
      - "80:80"

volumes:
  pgdata:
